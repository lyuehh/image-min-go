<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Image Min</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      --bg: #f4f4f6; --panel: rgba(255,255,255,.78); --panel-solid: #fff;
      --text: #202124; --muted: #71717a; --line: rgba(0,0,0,.09);
      --blue: #0a84ff; --blue-hover: #0077ed; --green: #1b9b56; --red: #d93025;
      --shadow: 0 16px 42px rgba(0,0,0,.09);
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#18181b; --panel:rgba(39,39,42,.8); --panel-solid:#27272a; --text:#f4f4f5; --muted:#a1a1aa; --line:rgba(255,255,255,.1); --shadow:0 18px 48px rgba(0,0,0,.3); }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; background: var(--bg); color: var(--text); overflow: hidden; user-select: none; }
    button, input { font: inherit; }
    .titlebar { height: 64px; display:flex; align-items:center; justify-content:center; -webkit-app-region:drag; border-bottom:1px solid var(--line); }
    .brand { display:flex; align-items:center; gap:9px; font-weight:650; letter-spacing:-.01em; }
    .brand svg { width:24px; height:24px; }
    main { height: calc(100% - 64px); max-width: 980px; margin:0 auto; padding:24px; display:flex; flex-direction:column; gap:16px; }
    .drop-zone { min-height:172px; border:1.5px dashed color-mix(in srgb, var(--muted) 45%, transparent); border-radius:18px; background:var(--panel); box-shadow:var(--shadow); display:grid; place-items:center; text-align:center; transition:.18s ease; }
    .drop-zone.over { border-color:var(--blue); background:color-mix(in srgb, var(--blue) 9%, var(--panel-solid)); transform:scale(.995); }
    .drop-content { padding:20px; }
    .drop-icon { width:46px; height:46px; margin:0 auto 10px; display:grid; place-items:center; border-radius:14px; color:var(--blue); background:color-mix(in srgb, var(--blue) 12%, transparent); }
    .drop-icon svg { width:25px; height:25px; }
    h1 { font-size:18px; margin:0 0 5px; letter-spacing:-.01em; }
    .hint { color:var(--muted); font-size:13px; margin:0 0 14px; }
    button { border:0; cursor:pointer; border-radius:9px; padding:8px 14px; color:var(--text); background:color-mix(in srgb, var(--muted) 13%, transparent); transition:.15s ease; -webkit-app-region:no-drag; }
    button:hover { background:color-mix(in srgb, var(--muted) 20%, transparent); }
    button:disabled { opacity:.45; cursor:default; }
    button.primary { color:white; background:var(--blue); font-weight:600; }
    button.primary:hover:not(:disabled) { background:var(--blue-hover); }
    .workspace { min-height:0; flex:1; display:flex; flex-direction:column; border:1px solid var(--line); border-radius:16px; background:var(--panel); overflow:hidden; }
    .toolbar { height:56px; flex:none; padding:0 14px; display:flex; align-items:center; gap:12px; border-bottom:1px solid var(--line); }
    .count { font-size:13px; color:var(--muted); margin-right:auto; }
    .quality { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted); }
    .quality input { width:100px; accent-color:var(--blue); }
    .quality output { width:25px; color:var(--text); font-variant-numeric:tabular-nums; }
    .list { min-height:0; overflow:auto; flex:1; }
    .empty { height:100%; display:grid; place-items:center; color:var(--muted); font-size:13px; }
    .row { min-height:65px; padding:10px 14px; display:grid; grid-template-columns:36px minmax(140px,1fr) 100px 130px 32px; gap:10px; align-items:center; border-bottom:1px solid var(--line); }
    .row:last-child { border-bottom:0; }
    .thumb { width:34px; height:34px; border-radius:9px; display:grid; place-items:center; background:color-mix(in srgb, var(--blue) 10%, transparent); color:var(--blue); }
    .thumb svg { width:18px; }
    .name { min-width:0; }
    .filename { font-size:13px; font-weight:570; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .path { margin-top:3px; color:var(--muted); font-size:11px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .size, .saving { font-size:12px; color:var(--muted); text-align:right; font-variant-numeric:tabular-nums; }
    .saving.good { color:var(--green); font-weight:600; }
    .saving.bad { color:var(--red); text-align:left; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .saving.busy { color:var(--blue); }
    .icon-button { width:30px; height:30px; padding:0; display:grid; place-items:center; background:transparent; color:var(--muted); }
    .icon-button svg { width:15px; height:15px; }
    .footer { min-height:48px; flex:none; padding:8px 14px; display:flex; align-items:center; gap:12px; border-top:1px solid var(--line); }
    .summary { margin-right:auto; font-size:12px; color:var(--muted); }
    .summary strong { color:var(--green); }
    .spinner { display:inline-block; width:11px; height:11px; margin-right:5px; border:1.5px solid color-mix(in srgb,var(--blue) 28%,transparent); border-top-color:var(--blue); border-radius:50%; animation:spin .7s linear infinite; vertical-align:-1px; }
    @keyframes spin { to { transform:rotate(360deg); } }
    @media (max-height: 620px) { .drop-zone { min-height:130px; } .drop-icon { display:none; } }
  </style>
</head>
<body>
  <header class="titlebar">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" fill="#0a84ff"/><path d="m7.5 16 3.2-3.4 2.35 2.2 1.9-2 2.55 3.2" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="15.8" cy="8.6" r="1.5" fill="white"/></svg>
      Image Min
    </div>
  </header>
  <main>
    <section class="drop-zone" id="dropZone" aria-label="拖放图片区域">
      <div class="drop-content">
        <div class="drop-icon"><svg viewBox="0 0 24 24" fill="none"><path d="M12 15V4m0 0L8 8m4-4 4 4M5 14v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <h1>把图片拖到这里</h1>
        <p class="hint">支持 PNG 和 JPEG，也可以拖入整个文件夹</p>
        <button id="pickButton">选择图片…</button>
      </div>
    </section>
    <section class="workspace">
      <div class="toolbar">
        <span class="count" id="count">还没有图片</span>
        <label class="quality" title="只影响 JPEG 图片">JPEG 质量 <input id="quality" type="range" min="40" max="100" value="82"><output id="qualityValue">82</output></label>
        <button id="clearButton" disabled>清空</button>
      </div>
      <div class="list" id="list"><div class="empty">添加图片后将在这里显示</div></div>
      <div class="footer">
        <span class="summary" id="summary">输出保存在原文件旁，不会覆盖原图</span>
        <button class="primary" id="compressButton" disabled>开始压缩</button>
      </div>
    </section>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    const state = { items: [], busy: false };
    const icon = `<svg viewBox="0 0 24 24" fill="none"><path d="M4 7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7Z" stroke="currentColor" stroke-width="1.7"/><circle cx="15.5" cy="9" r="1.5" fill="currentColor"/><path d="m6.5 16 3.5-3.7 2.6 2.4 2-2 3 3.3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    const closeIcon = `<svg viewBox="0 0 24 24" fill="none"><path d="m7 7 10 10M17 7 7 17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`;
    const revealIcon = `<svg viewBox="0 0 24 24" fill="none"><path d="M4 7.5h6l1.6 2H20v8.5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>`;
    const call = (method, ...args) => mygo.call("ImageService." + method, ...args);
    const formatSize = (bytes) => {
      if (bytes < 1024) return bytes + " B";
      const units = ["KB", "MB", "GB"]; let value = bytes / 1024, i = 0;
      while (value >= 1024 && i < units.length - 1) { value /= 1024; i++; }
      return value.toFixed(value >= 10 ? 1 : 2) + " " + units[i];
    };
    const escapeHTML = (value) => String(value).replace(/[&<>'"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));

    function render() {
      $("count").textContent = state.items.length ? `${state.items.length} 张图片` : "还没有图片";
      $("clearButton").disabled = !state.items.length || state.busy;
      $("compressButton").disabled = !state.items.some(x => !x.error) || state.busy;
      $("compressButton").innerHTML = state.busy ? '<span class="spinner"></span>压缩中' : "开始压缩";
      if (!state.items.length) {
        $("list").innerHTML = '<div class="empty">添加图片后将在这里显示</div>';
        $("summary").textContent = "输出保存在原文件旁，不会覆盖原图";
        return;
      }
      $("list").innerHTML = state.items.map((item, index) => {
        let status = '<span class="saving">等待压缩</span>';
        if (item.error) status = `<span class="saving bad" title="${escapeHTML(item.error)}">${escapeHTML(item.error)}</span>`;
        else if (item.processing) status = '<span class="saving busy"><span class="spinner"></span>处理中</span>';
        else if (item.result) {
          const saved = item.size - item.result.outputSize;
          const percent = item.size ? Math.round(saved / item.size * 100) : 0;
          status = saved > 0 ? `<span class="saving good">−${formatSize(saved)} · ${percent}%</span>` : '<span class="saving">已是最优</span>';
        }
        const action = item.result?.outputPath
          ? `<button class="icon-button" data-reveal="${index}" title="在 Finder 中显示">${revealIcon}</button>`
          : `<button class="icon-button" data-remove="${index}" title="移除" ${state.busy ? "disabled" : ""}>${closeIcon}</button>`;
        return `<div class="row"><div class="thumb">${icon}</div><div class="name"><div class="filename" title="${escapeHTML(item.name)}">${escapeHTML(item.name)}</div><div class="path" title="${escapeHTML(item.path)}">${escapeHTML(item.path)}</div></div><div class="size">${formatSize(item.size || 0)}</div>${status}${action}</div>`;
      }).join("");
      const finished = state.items.filter(x => x.result && !x.result.error);
      const saved = finished.reduce((n, x) => n + Math.max(0, x.size - x.result.outputSize), 0);
      $("summary").innerHTML = finished.length ? `已完成 ${finished.length} 张，共节省 <strong>${formatSize(saved)}</strong>` : "输出保存在原文件旁，不会覆盖原图";
    }

    async function addPaths(paths) {
      if (!paths?.length || state.busy) return;
      try {
        const inspected = await call("Inspect", paths);
        const known = new Set(state.items.map(x => x.path));
        for (const item of inspected || []) if (!known.has(item.path)) { state.items.push(item); known.add(item.path); }
        render();
      } catch (error) { $("summary").textContent = "读取失败：" + error.message; }
    }

    $("pickButton").onclick = async () => { try { await addPaths(await call("PickImages")); } catch (e) { $("summary").textContent = "选择失败：" + e.message; } };
    $("quality").oninput = (e) => $("qualityValue").textContent = e.target.value;
    $("clearButton").onclick = () => { state.items = []; render(); };
    $("list").onclick = (event) => {
      const remove = event.target.closest("[data-remove]");
      const reveal = event.target.closest("[data-reveal]");
      if (remove) { state.items.splice(Number(remove.dataset.remove), 1); render(); }
      if (reveal) call("Reveal", state.items[Number(reveal.dataset.reveal)].result.outputPath).catch(() => {});
    };
    $("compressButton").onclick = async () => {
      const candidates = state.items.filter(x => !x.error);
      if (!candidates.length) return;
      state.busy = true; candidates.forEach(x => { x.processing = true; x.result = null; }); render();
      try {
        const results = await call("Compress", candidates.map(x => x.path), { jpegQuality: Number($("quality").value) });
        candidates.forEach((item, i) => { item.processing = false; item.result = results[i]; if (results[i]?.error) item.error = results[i].error; });
      } catch (error) {
        candidates.forEach(item => { item.processing = false; item.error = error.message; });
      } finally { state.busy = false; render(); }
    };

    mygo.on("files-added", addPaths);
    mygo.on("inputs-ready", async () => addPaths(await call("TakePendingFiles")));
    const zone = $("dropZone");
    window.addEventListener("dragover", e => { e.preventDefault(); zone.classList.add("over"); });
    window.addEventListener("dragleave", e => { if (!e.relatedTarget) zone.classList.remove("over"); });
    window.addEventListener("drop", e => { e.preventDefault(); zone.classList.remove("over"); });
    render();
    call("TakePendingFiles").then(addPaths).catch(() => {});
  </script>
</body>
</html>
